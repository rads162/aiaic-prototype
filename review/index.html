<!DOCTYPE html><html lang="en"> <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>AIAIC prototype · review</title><style>
    :root { --bg:#fff; --surface:#f2f2f2; --line:#c9c9c9; --ink:#1a1a1a; --ink-3:#5f5f5f; --stage:#dcdcdc; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161616; --surface:#222; --line:#444; --ink:#f0f0f0; --ink-3:#a0a0a0; --stage:#0d0d0d; color-scheme: dark; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--stage); color: var(--ink); font: 14px/1.4 system-ui, "Segoe UI", "Nirmala UI", Roboto, Arial, sans-serif; }
    .bar { background: var(--bg); border-bottom: 1px solid var(--line); padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

    button, select, a.btn { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 34px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    select { max-width: 260px; }
    button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    button:disabled { opacity: .4; cursor: default; }
    :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
    #toggle { display: none; }
    .jbar { background: var(--surface); border-bottom: 1px solid var(--line); padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }

    .steps { display: flex; flex-wrap: wrap; gap: 4px; }
    .steps button { min-height: 28px; padding: 2px 9px; font-size: 12px; }
    .note { color: var(--ink-3); font-size: 12px; }
    /* Controls sit at the bottom of the screen (D-099) so the page keeps the top of the view */
    .stage { order: 1; } .jbar { order: 2; border-top: 1px solid var(--line); border-bottom: 0; } .bar { order: 3; border-top: 1px solid var(--line); border-bottom: 0; }
    .stage { flex: 1; min-height: 0; overflow: auto; display: flex; justify-content: center; align-items: flex-start; }
    .frame { background: var(--bg); transform-origin: top left; flex: none; }
    .frame.device { box-shadow: 0 0 0 1px var(--line), 0 6px 24px rgba(0,0,0,.18); margin: 12px 0; }
    iframe { border: 0; display: block; width: 100%; height: 100%; background: #fff; }
    @media (max-width: 760px) {
      #toggle { display: inline-flex; }
      .controls { display: none; width: 100%; }
      .bar.open .controls { display: flex; }
      .devices { display: none; }
      .title small { display: none; }
    }

tforms","platforms/mahaagx","projects","about/leadership","contact"],"J5 Investor":["ai4agri/2026","projects","projects/project-1","directory/implementer-1","ecosystem/partner-with-aiaic","ai4agri","contact"],"J6 FPO / farmer":["","for/farmers","platforms/mahavistaar","for/farmers","projects","projects/project-1","ecosystem/partner-with-aiaic"],"J7 International":["about","policy","about/governance","platforms","partnerships","ai4agri/2026","about/leadership","contact"]}</script> <script>
  (() => {
    const $ = (id) => document.getElementById(id);
    const PAGES = JSON.parse($('pages-data').textContent);       // [{ path: 'about/mandate/', title }]
    const JOURNEYS = JSON.parse($('journeys-data').textContent); // { name: ['', 'about/mandate', ...] }
    const SIZES = { 1440: [1440, 900], 1024: [1024, 768], 768: [768, 1024], 375: [375, 812] };
    const base = new URL('../', location.href);                  // site root, wherever it is hosted
    const view = $('view'), frame = $('frame'), stage = $('stage');
    const norm = (p) => (p || '').replace(/index\.html$/, '').replace(/^\/+/, '');
    const withSlash = (p) => (p && !p.endsWith('/') ? p + '/' : p);
    const state = { p: 'en/', d: 'fit', j: '', ph: false };

    // Read and write the view's state in the address, so a copied link reopens the same view.
    function readHash() {
      const q = new URLSearchParams(location.hash.slice(1));
      state.p = norm(q.get('p')) || 'en/';
      state.d = SIZES[q.get('d')] ? q.get('d') : 'fit';
      state.j = JOURNEYS[q.get('j')] ? q.get('j') : '';
      state.ph = q.get('ph') === '1';
    }
    function writeHash() {
      const q = new URLSearchParams({ p: state.p, d: state.d });
      if (state.j) q.set('j', state.j);
      if (state.ph) q.set('ph', '1');
      history.replaceState(null, '', '#' + q.toString());
    }
    const lang = () => (state.p.startsWith('mr/') ? 'mr' : 'en');
    const inner = () => state.p.replace(/^(en|mr)\/?/, '');

    // Page list, grouped by section, built from the pages that exist in this build.
    const sel = $('page');
    const groups = {};
    PAGES.forEach((pg) => { const g = pg.path.split('/')[0] || 'home'; (groups[g] = groups[g] || []).push(pg); });
    Object.entries(groups).forEach(([g, list]) => {
      const og = document.createElement('optgroup'); og.label = g === 'home' ? 'Home' : g.replace(/-/g, ' ').replace(/^./, (c) => c.toUpperCase());
      list.forEach((pg) => { const o = document.createElement('option'); o.value = pg.path; o.textContent = pg.title; og.append(o); });
      sel.append(og);
    });

    function go(path) { state.p = withSlash(norm(path)); view.src = new URL(state.p + 'index.html', base).href; sync(); }

    function layout() {
      const narrow = innerWidth <= 760;
      const d = narrow ? 'fit' : state.d;
      if (d === 'fit') { frame.className = 'frame'; frame.style.cssText = 'width:100%;height:100%;transform:none'; stage.style.overflow = 'hidden'; return; }
      const [w, h] = SIZES[d];
      const availW = stage.clientWidth - 24, availH = stage.clientHeight - 24;
      const s = Math.min(1, availW / w);
      const fullH = w >= 1024 ? Math.max(h, availH / s) : h;      // desktop sizes use the whole height
      frame.className = 'frame device';
      frame.style.cssText = `width:${w}px;height:${fullH}px;transform:scale(${s});margin-bottom:${12 - fullH * (1 - s)}px;margin-right:${-w * (1 - s)}px`;
      stage.style.overflow = 'auto';
    }

    function sync() {
      sel.value = inner() ? withSlash(inner()) : '';
      document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === lang())));
      document.querySelectorAll('[data-dev]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.dev === state.d)));
      $('ph').setAttribute('aria-pressed', String(state.ph));
      $('journey').value = state.j;
      $('public').href = new URL(state.p + 'index.html', base).href;
      const steps = JOURNEYS[state.j];
      $('jbar').hidden = !steps;
      if (steps) {
        const here = steps.findIndex((s) => withSlash(s) === withSlash(inner()));
        $('steps').replaceChildren(...steps.map((s, i) => {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = String(i + 1);
          b.title = s || 'home'; b.setAttribute('aria-pressed', String(i === here)); b.onclick = () => { stepIdx = i; go(lang() + '/' + s); }; return b;
        }));
        if (here >= 0) stepIdx = here;
        $('prev').disabled = stepIdx <= 0; $('next').disabled = stepIdx >= steps.length - 1;
        $('jnote').textContent = here >= 0 ? `${state.j}: step ${here + 1} of ${steps.length}` : `${state.j}: you have left the journey path. Pick a step to return.`;
      }
      writeHash(); layout();
    }
    let stepIdx = 0;

    // Mark placeholders inside the page (draft markers, "[...]" text awaiting content).
    function marks() {
      let doc; try { doc = view.contentDocument; } catch (e) { return; }
      if (!doc || !doc.documentElement) return;
      if (!doc.getElementById('review-ph-css')) {
        const st = doc.createElement('style'); st.id = 'review-ph-css';
        st.textContent = 'html.review-ph .badge.placeholder,html.review-ph .tx-pending,html.review-ph .ph,html.review-ph .review-ph-text{outline:3px dashed currentColor;outline-offset:2px;background-image:repeating-linear-gradient(45deg,rgba(128,128,128,.18) 0 6px,transparent 6px 12px)}';
        doc.head.append(st);
        const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT);
        for (let n; (n = walker.nextNode());) if (/^\s*\[[^\]]{3,}\]?/.test(n.nodeValue) && n.parentElement) n.parentElement.classList.add('review-ph-text');
      }
      doc.documentElement.classList.toggle('review-ph', state.ph);
    }

    view.addEventListener('load', () => {
      try { const p = view.contentWindow.location.pathname; const b = base.pathname; if (p.startsWith(b)) state.p = withSlash(norm(p.slice(b.length))) || 'en/'; } catch (e) {}
      sync(); marks();
    });
    sel.onchange = () => go(lang() + '/' + sel.value);
    document.querySelectorAll('[data-lang]').forEach((b) => (b.onclick = () => go(b.dataset.lang + '/' + inner())));
    document.querySelectorAll('[data-dev]').forEach((b) => (b.onclick = () => { state.d = b.dataset.dev; sync(); }));
    $('journey').onchange = (e) => { state.j = e.target.value; stepIdx = 0; if (state.j) go(lang() + '/' + JOURNEYS[state.j][0]); else sync(); };
    $('prev').onclick = () => { const s = JOURNEYS[state.j]; if (s && stepIdx > 0) { stepIdx--; go(lang() + '/' + s[stepIdx]); } };
    $('next').onclick = () => { const s = JOURNEYS[state.j]; if (s && stepIdx < s.length - 1) { stepIdx++; go(lang() + '/' + s[stepIdx]); } };
    $('ph').onclick = () => { state.ph = !state.ph; sync(); marks(); };
    $('copy').onclick = async () => { try { await navigator.clipboard.writeText(location.href); $('copy').textContent = 'Copied'; } catch (e) { prompt('Copy this link:', location.href); } setTimeout(() => ($('copy').textContent = 'Copy link'), 1500); };
    $('toggle').onclick = () => { const open = $('bar').classList.toggle('open'); $('toggle').setAttribute('aria-expanded', String(open)); layout(); };
    addEventListener('resize', layout);
    addEventListener('hashchange', () => { readHash(); go(state.p); }); // a pasted review link opened in the same tab
    readHash(); go(state.p);
  })();
  </script> </body> </html>
